<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Downloads - KINGFN</title>
<style>
:root{--bg:#0a0e17;--surf:#111726;--hover:#172033;--border:rgba(255,255,255,.08);
--text:#f0f4f8;--muted:#8899ac;--mint:#3df5c4;--cyan:#23aaff;--gold:#ffd700;--red:#ff453a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
header{background:var(--surf);border-bottom:1px solid var(--border);padding:16px 24px;
display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
h1{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,#fff 40%,var(--mint) 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-clear{margin-left:auto;background:rgba(255,68,58,.15);color:var(--red);
border:1px solid rgba(255,68,58,.3);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.8rem;font-weight:600}
main{padding:24px;max-width:900px;margin:0 auto}
.dl-item{background:var(--surf);border:1px solid var(--border);border-radius:12px;
padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.dl-icon{font-size:28px;flex-shrink:0}
.dl-info{flex:1;min-width:0}
.dl-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-url{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dl-bar-wrap{margin-top:8px;background:rgba(255,255,255,.07);border-radius:999px;height:5px;overflow:hidden}
.dl-bar{height:100%;border-radius:999px;transition:width .3s;background:linear-gradient(90deg,var(--mint),var(--cyan))}
.dl-status{font-size:.78rem;color:var(--muted);margin-top:4px}
.badge{padding:3px 10px;border-radius:999px;font-size:.73rem;font-weight:700;flex-shrink:0}
.badge.complete{background:rgba(61,245,196,.12);color:var(--mint);border:1px solid rgba(61,245,196,.3)}
.badge.downloading{background:rgba(35,170,255,.12);color:var(--cyan);border:1px solid rgba(35,170,255,.3)}
.badge.error{background:rgba(255,68,58,.12);color:var(--red);border:1px solid rgba(255,68,58,.3)}
.badge.cancelled{background:rgba(255,255,255,.07);color:var(--muted);border:1px solid var(--border)}
.empty{text-align:center;color:var(--muted);padding:80px 0;font-size:.95rem}
</style>
</head>
<body>
<header>
  <h1>&#8681; Downloads</h1>
  <button class="btn-clear" onclick="clearCompleted()">Clear Completed</button>
</header>
<main>
  <div id="downloadList"><div class="empty">No downloads yet.</div></div>
</main>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(s){if(!s)return'';try{var d=new Date(s);return d.toLocaleDateString()+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}catch(e){return s;}}
function fmtSize(b){if(!b)return'?';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}

var icons={complete:'✅',downloading:'⬇️',error:'❌',cancelled:'🚫'};

function loadDownloads(data){
  var el=document.getElementById('downloadList');
  if(!data||!data.length){el.innerHTML='<div class="empty">No downloads yet.</div>';return;}
  el.innerHTML=data.map(function(d){
    var icon=icons[d.status]||'📄';
    var pct=d.pct||0;
    var barHtml=d.status==='downloading'
      ?'<div class="dl-bar-wrap"><div class="dl-bar" style="width:'+pct+'%"></div></div>'
      :'';
    var statusText=d.status==='complete'?'Saved to: '+esc(d.savePath||''):
                   d.status==='downloading'?pct+'% · '+fmtDate(d.started):
                   d.status.charAt(0).toUpperCase()+d.status.slice(1)+' · '+fmtDate(d.started);
    return '<div class="dl-item">'
      +'<div class="dl-icon">'+icon+'</div>'
      +'<div class="dl-info">'
        +'<div class="dl-name">'+esc(d.filename)+'</div>'
        +'<div class="dl-url">'+esc(d.url)+'</div>'
        +barHtml
        +'<div class="dl-status">'+statusText+'</div>'
      +'</div>'
      +'<span class="badge '+d.status+'">'+d.status.toUpperCase()+'</span>'
      +'</div>';
  }).join('');
}

function clearCompleted(){loadDownloads([]);}

if(window.__kingfnDownloads) loadDownloads(window.__kingfnDownloads);
</script>
</body>
</html>
