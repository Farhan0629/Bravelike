<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History & Bookmarks - KINGFN</title>
<style>
:root{--bg:#0a0e17;--surf:#111726;--hover:#172033;--border:rgba(255,255,255,.08);
--text:#f0f4f8;--muted:#8899ac;--mint:#3df5c4;--cyan:#23aaff;--gold:#ffd700;
--red:#ff453a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
header{background:var(--surf);border-bottom:1px solid var(--border);padding:16px 24px;
display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
h1{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,#fff 40%,var(--mint) 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.05);border-radius:10px;padding:3px}
.tab{padding:6px 18px;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--muted);border:none;background:transparent;transition:.15s}
.tab.active{background:var(--surf);color:var(--text);font-weight:600}
.search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;
background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 12px}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.9rem}
.btn-clear{margin-left:auto;background:rgba(255,68,58,.15);color:var(--red);
border:1px solid rgba(255,68,58,.3);border-radius:8px;padding:5px 12px;
cursor:pointer;font-size:.8rem;font-weight:600}
.btn-clear:hover{background:rgba(255,68,58,.25)}
main{padding:24px;max-width:960px;margin:0 auto}
.section{margin-bottom:40px}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;
cursor:pointer;transition:.15s;text-decoration:none;color:var(--text)}
.item:hover{background:var(--hover)}
.favicon{width:18px;height:18px;border-radius:4px;background:var(--surf);
display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.item-title{font-size:.9rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-url{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.item-meta{font-size:.75rem;color:var(--muted);flex-shrink:0}
.item-actions{display:flex;gap:6px;opacity:0;transition:.15s}
.item:hover .item-actions{opacity:1}
.action-btn{background:transparent;border:1px solid var(--border);color:var(--muted);
border-radius:6px;padding:3px 8px;cursor:pointer;font-size:.75rem}
.action-btn:hover{color:var(--text);border-color:var(--mint)}
.action-btn.del:hover{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:.95rem}
.badge{background:rgba(61,245,196,.15);color:var(--mint);border:1px solid rgba(61,245,196,.3);
border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;margin-left:6px}
#historyPanel,#bookmarksPanel{display:none}
#historyPanel.active,#bookmarksPanel.active{display:block}
</style>
</head>
<body>
<header>
  <h1>&#128336; KINGFN</h1>
  <div class="tabs">
    <button class="tab active" onclick="showTab('history')">History</button>
    <button class="tab" onclick="showTab('bookmarks')">Bookmarks</button>
  </div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8899ac" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" placeholder="Search..." oninput="onSearch()">
  </div>
  <button class="btn-clear" onclick="clearActive()">Clear All</button>
</header>
<main>
  <div id="historyPanel" class="active">
    <div class="section">
      <div class="section-title">Browsing History <span class="badge" id="histCount">0</span></div>
      <div class="list" id="historyList"><div class="empty">No history yet.</div></div>
    </div>
  </div>
  <div id="bookmarksPanel">
    <div class="section">
      <div class="section-title">Bookmarks <span class="badge" id="bmCount">0</span></div>
      <div class="list" id="bookmarksList"><div class="empty">No bookmarks yet.</div></div>
    </div>
  </div>
</main>
<script>
var _history=[], _bookmarks=[], _activeTab='history';

function showTab(t){
  _activeTab=t;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});
  event.target.classList.add('active');
  document.getElementById('historyPanel').classList.toggle('active',t==='history');
  document.getElementById('bookmarksPanel').classList.toggle('active',t==='bookmarks');
}

function fmtDate(s){
  if(!s)return'';
  try{var d=new Date(s);return d.toLocaleDateString()+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
  catch(e){return s;}
}

function renderHistory(data){
  document.getElementById('histCount').textContent=data.length;
  var el=document.getElementById('historyList');
  if(!data.length){el.innerHTML='<div class="empty">No history yet.</div>';return;}
  el.innerHTML=data.map(function(h){
    return '<a class="item" href="'+h.url+'">'
      +'<div class="favicon">🌐</div>'
      +'<div style="flex:1;min-width:0"><div class="item-title">'+esc(h.title||h.url)+'</div>'
      +'<div class="item-url">'+esc(h.url)+'</div></div>'
      +'<div class="item-meta">'+h.visits+' visit'+(h.visits!==1?'s':'')+'<br>'+fmtDate(h.last)+'</div>'
      +'</a>';
  }).join('');
}

function renderBookmarks(data){
  document.getElementById('bmCount').textContent=data.length;
  var el=document.getElementById('bookmarksList');
  if(!data.length){el.innerHTML='<div class="empty">No bookmarks yet.</div>';return;}
  el.innerHTML=data.map(function(b){
    return '<a class="item" href="'+b.url+'">'
      +'<div class="favicon">&#11088;</div>'
      +'<div style="flex:1;min-width:0"><div class="item-title">'+esc(b.title||b.url)+'</div>'
      +'<div class="item-url">'+esc(b.url)+'</div></div>'
      +'<div class="item-meta">'+fmtDate(b.created)+'</div>'
      +'</a>';
  }).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function onSearch(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  renderHistory(q?_history.filter(function(h){return(h.url+h.title).toLowerCase().indexOf(q)>=0;}):_history);
  renderBookmarks(q?_bookmarks.filter(function(b){return(b.url+b.title).toLowerCase().indexOf(q)>=0;}):_bookmarks);
}

function clearActive(){
  if(_activeTab==='history'){if(confirm('Clear all browsing history?')){_history=[];renderHistory([]);}}
  else{if(confirm('Clear all bookmarks?')){_bookmarks=[];renderBookmarks([]);}}
}

function loadData(history,bookmarks){
  _history=history||[];_bookmarks=bookmarks||[];
  renderHistory(_history);renderBookmarks(_bookmarks);
}

// Auto-load if data was pre-injected before this script ran.
if(window.__kingfnHistory) loadData(window.__kingfnHistory,window.__kingfnBookmarks);
</script>
</body>
</html>
