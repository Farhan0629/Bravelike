name: Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B out/build -DKINGFN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build out/build --config Release
      - name: Test
        run: ctest --test-dir out/build -C Release --output-on-failure
      - name: Build-option regression checks
        run: python scripts/test-cmake-options.py
      - name: Home-page interaction contract checks
        run: node scripts/test-home-page.js
  windows-browser:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sandbox: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v5
      - name: Configure CEF browser
        shell: pwsh
        run: |
          cmake -S . -B out/cef -G "Visual Studio 17 2022" -A x64 -DKINGFN_ENABLE_CEF=ON -DUSE_SANDBOX=${{ matrix.sandbox }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build CEF browser
        shell: pwsh
        run: |
          cmake --build out/cef --config Release --target kingfn_browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify runtime files
        shell: pwsh
        run: |
          $dir = "out/cef/Release"
          $required = @("kingfn_browser.exe", "libcef.dll", "chrome_elf.dll", "icudtl.dat", "resources.pak", "config/blocklist.txt", "resources/home.html")
          if ("${{ matrix.sandbox }}" -eq "ON") { $required += "kingfn_browser.dll" }
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Missing runtime file: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kingfn-windows-sandbox-${{ matrix.sandbox }}
          path: out/cef/Release/
          if-no-files-found: error
          retention-days: 7
