name: 🏗️ Build & Release KINGFN Browser

on:
  # ── Manual trigger from GitHub UI (Actions tab → Run workflow) ─────────────
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0) — used for tag + installer name'
        required: true
        default: '0.3.0'
      draft:
        description: 'Publish as draft release (review before going live)'
        type: boolean
        default: false

  # ── Automatic trigger when you push a version tag: git tag v0.3.1 && git push --tags
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write   # needed to create releases and upload assets

env:
  CEF_VERSION: "152.0.7+g83ffcba+chromium-152.0.7977.83"
  BUILD_DIR: build

jobs:
  build-and-release:
    name: Build on Windows + Package + Release
    runs-on: windows-latest
    timeout-minutes: 150   # CEF download + build can take ~60-90 min on first run

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Resolve version & tag ─────────────────────────────────────────────
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            VER="${{ github.event.inputs.version }}"
            TAG="v${VER}"
          fi
          echo "version=$VER"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "exe=kingfn-browser-setup-${VER}.exe" >> "$GITHUB_OUTPUT"
          echo "Resolved → tag=$TAG  version=$VER"

      # ── 3. Cache CEF distribution (~400 MB, keyed by version) ────────────────
      - name: Cache CEF download
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ env.CEF_VERSION }}-windows64-minimal
          restore-keys: cef-${{ env.CEF_VERSION }}-

      # ── 4. Cache SQLite amalgamation (~1 MB, keyed by version) ───────────────
      - name: Cache SQLite download
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/_deps
          key: sqlite-3460100-${{ hashFiles('cmake/DownloadSQLite.cmake') }}

      # ── 5. Configure CMake ────────────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" -A x64 `
            -DKINGFN_ENABLE_CEF=ON `
            -DUSE_SANDBOX=OFF `
            -DKINGFN_BUILD_TESTS=OFF

      # ── 6. Build kingfn_browser in Release ────────────────────────────────────
      - name: Build kingfn_browser (Release)
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --config Release --target kingfn_browser -j4

      # ── 7. Verify the EXE exists ─────────────────────────────────────────────
      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "$env:BUILD_DIR\Release\kingfn_browser.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build output not found: $exe"
            Get-ChildItem "$env:BUILD_DIR\Release" -ErrorAction SilentlyContinue
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "kingfn_browser.exe found — $size MB"

      # ── 8. Install NSIS ───────────────────────────────────────────────────────
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version 3.10 -y --no-progress

      # ── 9. Build installer EXE with NSIS ─────────────────────────────────────
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsis  = "C:\Program Files (x86)\NSIS\makensis.exe"
          $build = Resolve-Path "$env:BUILD_DIR\Release"
          $repo  = Resolve-Path "."
          & $nsis /V3 `
            /DBUILD_OUT_DIR="$build" `
            /DREPO_ROOT="$repo" `
            /DPRODUCT_VERSION="${{ steps.ver.outputs.version }}" `
            "installer\kingfn-setup.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 10. Locate + rename the installer EXE ────────────────────────────────
      - name: Locate installer EXE
        id: installer
        shell: pwsh
        run: |
          # NSIS writes the file next to the .nsi script by default.
          $found = Get-ChildItem -Recurse -Filter "kingfn-browser-setup-*.exe" |
                   Select-Object -First 1
          if (-not $found) {
            Write-Error "Installer EXE not found. Check NSIS output above."
            exit 1
          }
          $dest = "${{ steps.ver.outputs.exe }}"
          Copy-Item $found.FullName -Destination $dest
          $size = [math]::Round($found.Length / 1MB, 1)
          Write-Host "Installer: $dest ($size MB)"
          echo "path=$dest" >> $env:GITHUB_OUTPUT

      # ── 11. Upload installer as workflow artifact (always) ────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingfn-browser-setup-${{ steps.ver.outputs.version }}
          path: ${{ steps.installer.outputs.path }}
          retention-days: 30

      # ── 12. Generate release notes ────────────────────────────────────────────
      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md << 'EOF'
          ## 👑 KINGFN Browser v${{ steps.ver.outputs.version }}

          ### What's in this release
          - ✅ **Multi-tab browsing** — Ctrl+T/W/Tab, per-tab shields & stats
          - ✅ **History & Bookmarks** — SQLite-backed, Ctrl+H viewer, Ctrl+D bookmark toggle
          - ✅ **Download Manager** — Progress tracking, Ctrl+J downloads page
          - ✅ **Persistent Shields** — Per-site ad-block preferences survive restarts
          - ✅ **Auto-update checker** — Notifies you when a newer version is available
          - ✅ **Shields Engine v3** — YouTube + Twitch + 300+ rules, zero-flash ad elimination
          - ✅ **NSIS Installer** — Desktop & Start Menu shortcuts, Add/Remove Programs

          ### Installation
          1. Download **`kingfn-browser-setup-${{ steps.ver.outputs.version }}.exe`** below
          2. Run it and follow the wizard
          3. Launch **KINGFN Browser** from the Desktop or Start Menu

          Your profile data (`KINGFNProfile/`) is preserved on upgrade.

          ### Build info
          - CEF: `${{ env.CEF_VERSION }}`
          - Compiler: MSVC 2022 (v143), C++20
          - Platform: Windows 64-bit
          - Commit: `${{ github.sha }}`
          EOF

      # ── 13. Create GitHub Release + attach EXE ────────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          DRAFT_FLAG=""
          if [[ "${{ github.event.inputs.draft }}" == "true" ]]; then
            DRAFT_FLAG="--draft"
          fi

          # Create or update the release.
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "👑 KINGFN Browser v${{ steps.ver.outputs.version }}" \
            --notes-file release-notes.md \
            $DRAFT_FLAG \
            "${{ steps.installer.outputs.path }}" || \
          gh release upload "${{ steps.ver.outputs.tag }}" \
            "${{ steps.installer.outputs.path }}" --clobber

      # ── 14. Print summary ─────────────────────────────────────────────────────
      - name: Print summary
        shell: bash
        run: |
          echo "## ✅ KINGFN Browser v${{ steps.ver.outputs.version }} released!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Installer:** \`${{ steps.ver.outputs.exe }}\`" >> $GITHUB_STEP_SUMMARY
          echo "🔖 **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
